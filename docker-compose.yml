services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: mkd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mkd}
      POSTGRES_DB: mkd
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - mkd_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mkd"]
      interval: 5s
      retries: 10
volumes:
  mkd_pgdata:
