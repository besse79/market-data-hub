name: MKD quality gate
on:
  push:
    paths:
      - 'src/quality_gate.py'
      - 'tests/test_quality_gate.py'
      - '.github/workflows/quality-gate-ci.yml'
  pull_request:
    paths:
      - 'src/quality_gate.py'
      - 'tests/test_quality_gate.py'
      - '.github/workflows/quality-gate-ci.yml'
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_quality_gate.py' -v
