name: Trading Factory - Hippique V30 fresh functional acceptance
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trading-factory-hippique-v30-fresh-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: [self-hosted, linux, trading-factory]
    timeout-minutes: 20
    steps:
      - name: Re-run full isolated PostgreSQL 5434 acceptance from local validated script
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT=/home/benoit/hippique
          [[ -d "$ROOT/.git" ]] || { echo 'NO-GO: no local Hippique repository'; exit 1; }
          [[ "$(id -un)" == benoit ]] || { echo 'NO-GO: wrong WSL user'; exit 1; }
          [[ -f "$ROOT/scripts/v30-functional-acceptance-unattended-readonly.sh" ]] || { echo 'NO-GO: missing local acceptance script'; exit 1; }
          [[ -f "$ROOT/scripts/v30-verify-functional-report.py" ]] || { echo 'NO-GO: missing local verifier'; exit 1; }
          [[ "$(pg_lsclusters --no-header | awk '$1==16 && $2=="v30" && $3==5434 && $4=="online"{print "yes"}')" == yes ]] || { echo 'NO-GO: isolated PG5434 offline'; exit 1; }
          bash "$ROOT/scripts/v30-functional-acceptance-unattended-readonly.sh"
          STAGE=$(find "$ROOT/backups/v30" -maxdepth 1 -type d -name 'release-candidate-*' -print | sort | tail -1)
          python3 "$ROOT/scripts/v30-verify-functional-report.py" "$STAGE/api-pg-integrated-results.json"
          echo 'PASS: freshly rerun API functional acceptance against isolated PG5434; no production cutover'
