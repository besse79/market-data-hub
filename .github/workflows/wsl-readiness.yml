name: MKD WSL readiness
on:
  push:
    branches: [fix/p0-yahoo-unverified-ingestion-20261123]
    paths: ['.github/workflows/wsl-readiness.yml', 'scripts/recover_eur_usd_reference.py']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mkd-wsl-readiness
  cancel-in-progress: false
jobs:
  readiness:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - name: Real MKD read-only readiness
        shell: bash
        run: |
          set -euo pipefail
          grep -qi microsoft /proc/sys/kernel/osrelease
          pg_isready -h /var/run/postgresql -p 5433
          PGOPTIONS='-c default_transaction_read_only=on -c statement_timeout=30000' psql -X -h /var/run/postgresql -p 5433 -d market_data_hub -v ON_ERROR_STOP=1 <<'SQL'
          SELECT current_database(), current_setting('transaction_read_only');
          SELECT currency, count(*) FROM public.instrument_identifiers WHERE provider='yahoo' AND valid_to IS NULL GROUP BY currency ORDER BY currency;
          SELECT currency, quality_status, count(*), max(session_date) FROM public.eod_bars WHERE provider='yahoo' AND currency IN ('EUR','USD') GROUP BY currency,quality_status;
          SELECT version_num FROM alembic_version;
          SELECT provider,currency,count(*) FROM public.instrument_identifiers GROUP BY provider,currency ORDER BY provider,currency;
          SELECT b.currency,count(DISTINCT b.instrument_id) AS historical_instruments,count(DISTINCT i.instrument_id) AS mapped_instruments
          FROM public.eod_bars b LEFT JOIN public.instrument_identifiers i ON i.instrument_id=b.instrument_id AND i.provider='yahoo' AND i.valid_to IS NULL
          WHERE b.provider='yahoo' AND b.currency IN ('EUR','USD') GROUP BY b.currency;
          SELECT count(*) FROM public.legacy_symbol_map;
          SELECT currency,mic,mic_verified,count(*) FROM public.legacy_symbol_map WHERE currency IN ('EUR','USD') GROUP BY currency,mic,mic_verified ORDER BY currency,mic;
          SELECT currency,count(*) FROM (SELECT currency,symbol FROM public.legacy_symbol_map WHERE currency IN ('EUR','USD') GROUP BY currency,symbol HAVING count(DISTINCT instrument_id)>1) conflicts GROUP BY currency;
          SQL
          test -x "$HOME/market-data-hub/.venv/bin/uvicorn"
          mkdir -p "$HOME/.config/systemd/user"
          unit="$HOME/.config/systemd/user/mkd-api-8100.service"
          if test -f "$unit"; then
            cp -p "$unit" "$unit.backup.$(date -u +%Y%m%dT%H%M%SZ)"
            cmp -s "$unit" deploy/systemd/mkd-api-8100.service || { echo "Existing unit differs; refusing overwrite"; exit 1; }
          else
            install -m 644 deploy/systemd/mkd-api-8100.service "$unit"
          fi
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          test -S "$XDG_RUNTIME_DIR/bus" || { echo "User systemd bus absent"; exit 1; }
          systemctl --user daemon-reload
          systemctl --user enable --now mkd-api-8100.service
          for i in {1..20}; do
            if curl --fail --silent --show-error --max-time 3 http://127.0.0.1:8100/health/live; then break; fi
            sleep 1
          done
          curl --fail --silent --show-error --max-time 5 http://127.0.0.1:8100/health/live
          systemctl --user is-active mkd-api-8100.service
          PGOPTIONS='-c default_transaction_read_only=on -c statement_timeout=30000' psql -X -h /var/run/postgresql -p 5433 -d market_data_hub -v ON_ERROR_STOP=1 <<'SQL'
          SELECT column_name,data_type FROM information_schema.columns WHERE table_schema='public' AND table_name='legacy_symbol_map' ORDER BY ordinal_position;
          SELECT count(DISTINCT instrument_id),currency FROM eod_bars WHERE currency IN ('EUR','USD') GROUP BY currency;
          SELECT provider,currency,count(*) FROM instrument_identifiers GROUP BY provider,currency ORDER BY provider,currency;
          SQL
          find "$HOME/cto-weinstein-trader" -maxdepth 4 -type f -iname '*manifest*.csv' -not -path '*/node_modules/*' -print 2>/dev/null | head -30

      - name: Install daily collector from verified checkout
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          test -S "$XDG_RUNTIME_DIR/bus"
          root="$HOME/market-data-hub"
          original="$root/evidence/refresh-46078610552.json"
          report="$root/evidence/retry-$GITHUB_RUN_ID.json"
          export DATABASE_URL="postgresql+psycopg://benoit@/market_data_hub?host=/var/run/postgresql&port=5433"
          retry_status=0
          PYTHONPATH="$PWD" "$root/.venv/bin/python" scripts/retry_failed_refresh.py "$original" "$report" || retry_status=$?
          "$root/.venv/bin/python" -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d["expected"] == d["processed"] == 802 and not d["dry_run"] and d["retried"] > 0' "$report"
          if test "$retry_status" != 0; then echo "::warning::Unresolved provider data; collection service may run but data readiness remains blocked"; fi
          dest="$root/daily-runtime/$GITHUB_SHA"
          test ! -e "$dest"
          mkdir -p "$dest" "$HOME/.config/systemd/user"
          cp -a app scripts "$dest/"
          bash -n "$dest/scripts/daily_eod.sh"
          "$root/.venv/bin/python" -m compileall -q "$dest/app"
          backup="$root/backups/daily-units-$(date -u +%Y%m%dT%H%M%SZ)"
          mkdir -p "$backup"
          for unit in mkd-daily-eod.service mkd-daily-eod.timer; do
            if test -e "$HOME/.config/systemd/user/$unit"; then
              cp -a "$HOME/.config/systemd/user/$unit" "$backup/"
            fi
            sed "s|%h/market-data-hub/scripts/daily_eod.sh|$dest/scripts/daily_eod.sh|g" "deploy/systemd/$unit" > "$HOME/.config/systemd/user/$unit"
          done
          systemd-analyze --user verify "$HOME/.config/systemd/user/mkd-daily-eod.service" "$HOME/.config/systemd/user/mkd-daily-eod.timer"
          systemctl --user daemon-reload
          systemctl --user enable --now mkd-daily-eod.timer
          systemctl --user is-active mkd-daily-eod.timer
          systemctl --user list-timers mkd-daily-eod.timer --all --no-pager
          PGOPTIONS='-c default_transaction_read_only=on' psql -X -h /var/run/postgresql -p 5433 -d market_data_hub -v ON_ERROR_STOP=1 -c "SELECT currency,quality_status,count(*),max(session_date) FROM eod_bars WHERE provider='yahoo' AND currency IN ('EUR','USD') GROUP BY currency,quality_status"
          exit "$retry_status"
